  <path d="M19 15 L24 21 L29 15" fill="none" stroke="#b03535" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 底部排版横线：长（标题）+ 短（正文） -->
  <line x1="18" y1="26" x2="29" y2="26" stroke="#2b579a" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="30" x2="25" y2="30" stroke="#9aa7b5" stroke-width="1.6" stroke-linecap="round"/>
